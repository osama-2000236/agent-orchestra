<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Subagent Orchestra</title>
  <desc id="banner-desc">Subagent Orchestra: fire subagents on the model that has earned the job. Title with a three-node diagram. A lead model verifies. Cheap workers do most of the work. A second-vendor reviewer checks a pinned commit, and its findings return to the lead.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#CBD5E1"/>
    </marker>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="60" y="130" font-size="60" font-weight="700" fill="#F8FAFC">Subagent Orchestra</text>
    <text x="60" y="185" font-size="26" fill="#F8FAFC">Fire subagents on the model that has earned the job.</text>
    <text x="60" y="224" font-size="20" fill="#94A3B8">Lead verifies · cheap models do the work · gets sharper every run</text>
    <text x="60" y="280" font-size="18" fill="#94A3B8">Evidence ledger  ·  role routing  ·  bounded review</text>
  </g>

  <g stroke="#CBD5E1" stroke-width="2.5" fill="none">
    <line x1="860" y1="126" x2="850" y2="200" marker-end="url(#arrow)"/>
    <line x1="1080" y1="126" x2="1110" y2="200" marker-end="url(#arrow)"/>
    <line x1="1180" y1="200" x2="1180" y2="126" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" text-anchor="middle">
    <rect x="740" y="50" width="460" height="76" rx="14" fill="#1D4ED8"/>
    <text x="970" y="83" font-size="26" font-weight="700" fill="#FFFFFF">Lead</text>
    <text x="970" y="112" font-size="19" fill="#FFFFFF">plans, decides, verifies</text>

    <rect x="740" y="200" width="220" height="76" rx="14" fill="#0F766E"/>
    <text x="850" y="232" font-size="22" font-weight="700" fill="#FFFFFF">Cheap workers</text>
    <text x="850" y="260" font-size="16" fill="#FFFFFF">scout, test, implement</text>

    <rect x="1000" y="200" width="220" height="76" rx="14" fill="#92400E"/>
    <text x="1110" y="232" font-size="22" font-weight="700" fill="#FFFFFF">Second vendor</text>
    <text x="1110" y="260" font-size="16" fill="#FFFFFF">read-only, pinned commit</text>
  </g>
</svg>
